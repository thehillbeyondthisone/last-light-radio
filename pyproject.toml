[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "last-light-radio"
version = "0.1.0"
description = "Local creator tools for deterministic animated episodes"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.3,<13"]

[project.optional-dependencies]
media = ["imageio-ffmpeg==0.6.0"]

[project.scripts]
last-light-radio = "last_light_radio.cli:main"

[tool.setuptools]
packages = ["last_light_radio"]
